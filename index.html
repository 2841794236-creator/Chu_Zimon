<script>
window.CHU_DATA={"cats": [{"key": "sky", "name": "天象神异纹", "en": "CELESTIAL", "c1": "#171714", "c2": "#A9B7B4", "deep": "#1b1f1f", "count": 11, "entries": 16, "origin": ["东皇太一是楚人心目中的最高神，多位学者认为他就是北极星。《楚辞章句》：“太一，星名，天之尊神，祠在楚东以配东帝，故云东皇。”《史记·天官书》：“中宫天极星，其一明者，太一常居也。”北极星像纹同时也是楚人祖先颛顼的象征。", "楚国王族的祖先曾掌管历法，天文学因此进入纹样。《尚书》所说“璇玑玉衡以齐七政”，指北斗七星与日月五星以北极星为中心同步异向旋转；《九歌·东君》中“援北斗兮酌桂浆”，被书中视为楚人观察北斗柄与太阳旋转的证据。", "天象纹也服务于丧葬。楚墓“苓床”形成了“以表现北极星为中心的纹样群”，目的是引导墓主灵魂“像龙一样升天，与天极中的北极星一样永存”。楚人相信死者可以像周行不怠的星象一样升天而重生。", "这一图式影响深远：北极星像纹“最后演变为阴阳双鱼图，是宋代定型的八卦图的前身”，后世“喜相逢”“推磨”式构图都由它演变而来；汉代瓦当“中心留圆、十字四分”的构图延续楚制，并发展出四神纹。"], "quote": "楚国纹样中体现了以北极星崇拜为主的精神信仰体系。", "quoteSrc": "结论", "meaning": "北极崇拜 · 观象授时 · 灵魂永存 · 天人秩序", "visual": [{"t": "北极星像纹", "d": "中心圆点象征太一，两道反向勾线象征同步异向旋转的北斗柄与太阳，构成富有动感的旋转式构图。"}, {"t": "天极纹", "d": "外形以“十”字为基础，周边有写实或抽象的龙凤；没有运动轨迹，因而偏静态。书中分三式。"}, {"t": "太阳纹", "d": "以圆形为主，内含多个大小不一的小圆圈，常出现在凤纹身体中，与凤共生。"}, {"t": "骨架构图", "d": "适合纹样常用九宫格式、环形线式、“S”线式骨架，模仿古天文学的四方八位；铜镜依外形适形构图，另有三至六山的山字纹镜。"}]}, {"key": "beast", "name": "神兽图腾纹", "en": "TOTEMIC BEASTS", "c1": "#A9372A", "c2": "#171714", "deep": "#2a1613", "count": 22, "entries": 25, "origin": ["楚国王族自认为颛顼、祝融之后。祝融曾担任商周两代“观象授时、点火烧荒、守燎祭祖”的大巫之职，凤正是祝融的象征。楚人因而在器物中“有意的突出了凤纹的地位，其数量远超东周时期中原地区的诸侯国”。", "神兽同时是天文方位的符号。在楚国天文学里，龙、凤、虎分别对应东宫、南宫、西宫，“四季的变化都是通过龙的形态变化而产生的”。凤在《鹖冠子》中被视为“鹑火之禽”，楚地分野为鹑尾，这也是西周、楚、秦都崇凤的原因。", "神兽也承担生死观念。书中认为楚墓所出镇墓兽“即为龙的造型，是引导死者升天的神物”；人鸟合体纹是汉代羽人的前身，“汉代羽化升天的说法亦是楚国凤鸟纹崇拜的流变”。", "《汉书·地理志》说“楚人信巫鬼，重淫祀”。在楚人看来，北斗与太阳绕北极星周行不息，“运动才是生命的象征”，所以凤纹多作展翅欲飞之状，虎纹多作蓄势待发之姿。"], "quote": "凤鸟纹是极具地域特色的纹样……由于祝融亦被楚人认为是其祖先之一，而凤正是祝融的象征。", "quoteSrc": "第二章第一节 · 动物类纹样系列（一）凤鸟纹系列", "meaning": "祖先崇拜 · 太阳崇拜 · 引魂升天 · 方位守护", "visual": [{"t": "凤鸟纹六式", "d": "形体完整的凤鸟纹、简化凤鸟纹、龙形凤纹、三头凤纹、扶桑凤鸟纹、羽人纹。冠有单冠、花冠、三分冠、龙角形冠，尾有长鱼尾、短鱼尾、长垂尾。"}, {"t": "龙纹九类", "d": "写实、凤形、蛇形、两头、双体、蟠绕、虺纹、散纹、变形云龙。各器物中的龙纹“鲜有完全一样的造型”，体现楚人“不守成规、因势而变”的装饰原则。"}, {"t": "兼体与组合", "d": "三头凤以“兼体造型”在双翅顶端生出另外两个凤头；虎座凤架鼓、虎座立凤把凤、虎、鹿角组合成一件器物。"}, {"t": "写实配角", "d": "鹿、虎（楚语称“於菟”）、蛇、鱼、蝉、骆驼多作配角，常与龙凤同处一画。"}, {"t": "色彩", "d": "漆器以黑底朱绘为主，辅以黄、金；红色是楚人崇拜的太阳之色，也是南方的象征色。"}]}, {"key": "plant", "name": "自然植物纹", "en": "FLORA", "c1": "#5E6B3E", "c2": "#B99A62", "deep": "#22261a", "count": 7, "entries": 8, "origin": ["书中植物纹数量不多，集中在第二章第一节“三、植物纹系列”，包括莲花纹、叶纹、树纹；动物类中的扶桑凤鸟纹也涉及植物与花叶的表现。书中没有“卷草纹”“缠枝花叶纹”的专名。", "扶桑是上古神话中的通天神树。《山海经·海外东经》：“汤谷上有扶桑，十日所浴……九日居下枝，一日居上枝。”郭璞《玄中记》称其“上至天，盘婉而下屈，通三泉”。凤鸟是火神祝融的化身，太阳顺着扶桑升起，楚人借这一组合寄托“灵魂不灭，将会升天为神”的信念。", "四片一组的叶纹（四叶纹）历史最久，大汶口文化中已经出现。书中认为它“极有可能与先秦时期的古人表现的天极或天盖”有关，《说苑·辨物》有“发于一……周于四”。另有学者把这种叶纹读作茱萸纹，取其逢凶化吉之意。", "莲花纹的来源有过争论：丁山、张正明认为它受印度佛教影响，邵学海认为是中国本土产生的纹样。九连墩铜方壶的八瓣莲冠四角都有凤首，可见楚人把中原的莲瓣样式改造成了自己的神鸟主题。"], "quote": "扶桑从凤鸟的头和翅膀处分别伸展而出，与凤鸟共生合体。", "quoteSrc": "第二章第一节 · 扶桑凤鸟纹", "meaning": "通天神树 · 太阳栖息 · 逢凶化吉 · 天盖四方", "visual": [{"t": "平铺线造型", "d": "扶桑凤鸟纹不用透视，采用二维程式化的平铺构图，扶桑以“点”和“线”出现，与凤鸟的“面”形成对比。"}, {"t": "叶纹三式", "d": "椭圆形、心形、掌形，正面平视，叶脉清晰；四至八片围绕镜钮等距放射排列。"}, {"t": "树纹两路", "d": "包山、长沙楚墓漆器中写实的垂柳式树纹，柔美飞动；余岗楚墓铜匜上则是一圈几何化树纹。"}, {"t": "莲瓣与器形", "d": "青铜方壶莲瓣为八，天星观莲花豆为十四瓣，豆柄常由圆雕的凤鸟与龙构成。"}]}, {"key": "geo", "name": "几何装饰纹", "en": "GEOMETRIC", "c1": "#9A5B34", "c2": "#A88446", "deep": "#2a1e15", "count": 10, "entries": 17, "origin": ["楚国几何纹并不只是装饰。书中把云雷纹放在“天体星像纹系列”：圆形的螺旋称云纹，方形的螺旋称雷纹，最早可以追溯到江苏金坛三星村新石器时代遗址出土的红衣陶豆。", "很多几何纹是工艺的产物。丝织品中的图形“必须适应制造工艺的要求，因而一些图形是被迫变形为几何形的”；塔形纹仅见于楚国双色锦，由经线交替起花，只用三种经线组合就得到多变的效果；竹器则由红、黑竹篾编出十字、人字、回纹。", "几何纹体现了楚人“因势而异”的装饰原则。绹纹“有的围合在器壁四周，似乎要对器物起到加固作用”；弦纹最初是陶器上加固用的泥条，后来才被修饰成平行线条。", "几何骨架让画面“条理清晰，秩序井然”。楚器存在一套“以红、黑二色为主”的色彩体系，注重面积、色相、明度、冷暖的对比与调和；山字纹镜与商周勾连雷纹有渊源（孔祥星说）。"], "quote": "体现了楚人不受约束，因势而异的装饰原则。", "quoteSrc": "第二章第一节 · 几何类纹样系列（二）绹纹", "meaning": "天象抽象 · 工艺秩序 · 因势而异 · 红黑色律", "visual": [{"t": "云雷纹五式", "d": "“O”形（涡纹）、“C”形、“S”形、三角形、勾连形，多为二方或四方连续。"}, {"t": "菱形与杯纹", "d": "小菱形、大菱形、十字菱形、石字菱形；杯纹（双菱纹）由一个大菱形和两个小菱形叠合，形似耳杯。"}, {"t": "鳞纹排列", "d": "横向鳞纹（重环纹）贴合口沿、盖顶排列；垂鳞纹呈“U”形竖向并排，多见于升鼎腹部。"}, {"t": "多角形", "d": "三角形、六角形排列规律性强，鄂城楚墓陶盘以环状三角形表现太阳光芒。"}, {"t": "铜镜几何", "d": "连弧纹多为六至十四弧；菱形纹镜分叠状、框状；花叶纹镜四方各一叶，成为视觉中心。"}]}], "styles": [{"key": "S1", "short": "渐变", "en": "GRADIENT", "bg": "#0B0B0E", "palette": ["#FFA8CE", "#A0F2D2", "#76C4FF", "#C4A6 射构图 / 生长纹", "plan": "单元由中心一圈圈向外生长，环带反向旋转。", "rep": 46, "nums": [46, 47, 48, 49, 50]}], "motifs": [{"no": 1, "title": "凤羽流霞", "cat": 1, "entryNo": 1, "entry": "凤鸟纹", "style": "S1", "note": "取点斑凤鸟的回旋羽冠，左右镜像为对称凤形，以马卡龙渐变填色。", "chapter": "第二章“楚国纹样的类别及构成要素”／第一节“楚国纹样的类别及象征意义”／二、动物类纹样系列／（一）凤鸟纹系列，该节标题下第1段", "pages": "P67、P68", "figs": "图2.36 锡器中与太阳共生的凤纹；图2.37 凤鸟践蛇纹绣中的鱼尾凤；图2.39 长鱼尾凤鸟纹；图2.40 短鱼尾凤鸟纹", "desc": "在楚国器物中，凤鸟纹是极具地域特色的纹样，虽然在商、西周时期就已经有了大量的凤鸟纹，但其造型均与楚国凤鸟纹存在差异。楚人一方面继承、发展了商、西周以来的凤鸟纹，另一方面由于祝融亦被楚人认为是其祖先之一，而凤正是祝融的象征，因而楚人在器物中有意的突出了凤纹的地位，其数量远超东周时期中原地区的诸侯国。书中将楚国凤鸟纹分为六种样式：形体完整的凤鸟纹、简化的凤鸟纹、龙形凤纹、三头凤纹、扶桑凤鸟纹、羽人纹。", "supp": "可参考湖北省博物馆“楚文化”专题展、荆州博物馆楚式漆器展及《江陵马山一号楚墓》考古报告。马山一号楚墓出土的凤鸟花卉纹绣、蟠龙飞凤纹绣等，是研究楚国凤鸟纹最权威的实物资料之一；《中国青铜器全集·东周4》《楚美术图集》也收录有大量楚系凤鸟纹线图与图版。", "motion": "flow"}, {"no": 2, "title": "羽人登霄", "cat": 1, "entryNo": 4, "entry": "人鸟合体纹", "style": "S1", "note": "人鸟合体的羽臂与长袍拆成扁平色块，中轴对称，顶部饰芒星。", "chapter": "第二章／第一节／二、动物类纹样系列／（一）凤鸟纹系列／1、凤纹的类别／（6）人鸟合体纹，该小节第1段", "pages": "P77、P79", "figs": "图2.66 羽人”漆器；图2.67 人树纹；图2.68 人鸟形的玉觽；图2.69 包山琴瑟中的人鸟纹", "desc": "当前发现的楚国人鸟合体纹数量不多，具有代表性的分别为春秋晚期曹家岗5号墓中的玉、战国中期天星观2号墓中的漆木羽人、信阳楚墓漆木瑟上的鸟爪人等，其造型方法虽然不尽相同，但其中的主要特征均为同时融合了鸟与人的特征。", "supp": "可参考荆州博物馆藏天星观2号墓漆木羽人、信阳楚墓出土漆木器，以及《当阳曹家岗5号楚墓》《信阳楚墓》等考古报告。相关图像可参阅《楚美术图集》《楚文物图典》。", "motion": "flow"}, {"no": 3, "title": "双凤负鼓", "cat": 1, "entryNo": 23, "entry": "虎座凤架鼓", "style": "S1", "note": "保留双凤相背、虎座承鼓的对称骨架，鼓面转为芒星圆盘。", "chapter": "第三章／第三节／二、漆器中的纹样／（二）乐器／2、虎座凤架鼓，该节第1段", "pages": "P216、P82", "figs": "图3.248 余岗楚墓漆木虎座凤架鼓；图3.249 河姆渡骨匕形器；图3.250 河姆渡象牙蝶形器", "desc": "虎座凤架鼓在楚墓中出土了大量的实物，最早见于战国早期信阳楚墓中，当前已经发现了数十件，是楚国器物中极具特色的造型之一。各个地区所出的虎座凤架鼓大同小异，其整体造型基本对称，双凤相背，凤鸟长颈而昂首，头上有冠，外表绘有羽纹、鳞纹等细节，一圆鼓悬于双凤的后背之上，有的鼓面绘有“北极星像纹”、凤纹等，鼓侧面绘有绚纹、云纹等，凤足各踏一虎，两虎尾部相连，张口露齿，尾巴上翘。书中认为虎座凤架鼓中的双凤与鼓象征太阳，虎座表示月亮，表现了楚人对日月的崇拜。", "supp": "可参考湖北省博物馆、荆州博物馆、信阳博物馆藏虎座凤架鼓，以及《信阳楚墓》《江陵天星观1号楚墓》《九连墩》等报告。相关研究可参阅《楚漆器研究》《楚艺术史》。", "motion": "flow"}, {"no": 4, "title": "太一临坛", "cat": 0, "entryNo": 3, "entry": "东皇太一", "style": "S1", "note": "居中的人形太一与两侧龙纹对称展开，以渐变区分神人与龙。", "chapter": "第二章／第一节／一、天体星像纹样系列／（一）“北极星像纹”，该节第1段", "pages": "P58", "figs": "图2.16 商周青铜器中的太一形象；图2.17 楚国神人操两龙玉器；图2.18 商代“兽面纹”", "desc": "今人李学勤、阿城、吴广平等多位学者均认为东皇太一即为楚人心目中的北极星。东皇太一是楚人心目中的最高神灵，屈原在《楚辞·九歌》中开篇就对其进行了描述，足见其身份之显赫，与楚人关系之密切。《楚辞章句》中有：“太一，星名，天之尊神，祠在楚东以配东帝，故云东皇。”", "supp": "可参考《楚辞》及《楚辞章句》相关注释，以及湖北省博物馆“楚文化”展陈。相关研究可参阅《楚辞与神话》《楚艺术史》。", "motion": "flow"}, {"no": 5, "title": "扶桑栖凤", "cat": 2, "entryNo": 1, "entry": "扶桑凤鸟纹", "style": "S1", "note": "扶桑枝条与凤鸟共生合体的对称构图，枝叶点线化。", "chapter": "第二章／第一节／二、动物类纹样系列／（一）凤鸟纹系列／5、扶桑凤鸟纹，其中“（2）‘扶桑凤鸟纹’”第1段", "pages": "P75-P76", "figs": "图2.60 扶桑凤鸟纹；图2.61 曾侯乙墓扶桑凤鸟纹；图2.62 三星堆遗址扶桑凤鸟纹；图2.63 马王堆“T”形帛画局部", "desc": "从造型上分析，“扶桑凤鸟纹”中的图形均不应用透视原理，采用二维程式化的平铺式构图以线造型，图形比较注重外轮廓的描绘，扶桑在画面中以“点”和“线”的形式出现，与凤鸟的“面”形成鲜明的对比。从构图上看，扶桑从凤鸟的头和翅膀处分别伸展而出，与凤鸟共生合体。书中认为“扶桑凤鸟纹”是楚人应用象征性思维的结果，其中承载着楚人所崇尚的精神内涵。", "supp": "可参考《江陵马山一号楚墓》报告及湖北省博物馆、荆州博物馆相关展品。相关研究可参阅《楚人的纺织与服饰》《中国丝绸通史》。", "motion": "flow"}, {"no": 6, "title": "菱锦织星", "cat": 3, "entryNo": 6, "entry": "菱形纹", "style": "S2", "note": "十字菱形纹采样到 8px 格点，八向对称成星形与菱形两种团花。", "chapter": "第二章／第一节／四、几何类纹样系列／（一）菱形纹，该节标题下第1段", "pages": "P112、P113", "figs": "图2.178 小菱形纹锦；图2.179 铜剑；图2.180 大菱形纹锦；图2.181 十字菱形纹", "desc": "菱形纹的单元形为菱形或近似菱形，广泛的出现在丝织品、陶器、铜器、漆器中，大多为连续纹样。由于丝织品中的造型必须适应制造工艺的要求，因而一些图形是被迫变形为几何形的，现在已经很难分辨出部分图形原来的形式特征。菱形纹是楚国几何纹样中数量较多的一种类型，在丝织品中的视觉形式最为丰富。书中将其分为小菱形纹、大菱形纹、十字菱形纹、石字菱形纹。", "supp": "可参考荆州博物馆藏马山1号楚墓织锦、湖南省博物馆藏长沙楚墓丝织品，以及《江陵马山一号楚墓》《长沙楚墓》报告。相关研究可参阅《楚人的纺织与服饰》《中国丝绸通史》。", "motion": "repeat"}, {"no": 7, "title": "杯纹叠锦", "cat": 3, "entryNo": 11, "entry": "杯纹", "style": "S2", "note": "大小菱形叠合的杯纹转为十字针脚，紫玫到青蓝渐变。", "chapter": "第二章／第一节／四、几何类纹样系列／（六）杯纹，该节第1段", "pages": "P115", "figs": "图2.192 三色大菱形纹；图2.193 铜镜；图2.194 漆奁顶面", "desc": "杯纹在楚国器物中存在多种样式，不同材质的器物中的构成形式不尽相同。丝织品、漆木器、陶器中的杯纹又被称为双菱纹，由一个大菱形和两旁两个小菱形叠合而成，外形似几何形的耳杯，故而得名。丝织品中的杯纹以线造型，其中还有丰富的细节，如马山1号墓所出三色锦中的杯纹中间有多道与杯纹边缘线平行的线条。", "supp": "可参考荆州博物馆藏马山1号楚墓三色锦、湖南省博物馆藏长沙楚墓丝织品，以及《江陵马山一号楚墓》《长沙楚墓》报告。相关研究可参阅《楚人的纺织与服饰》。", "motion": "repeat"}, {"no": 8, "title": "经纬织影", "cat": 3, "entryNo": 10, "entry": "塔形纹", "style": "S2", "note": "双色锦中的塔形单元按经线方向起花，正倒相间。", "chapter": "第二章／第一节／四、几何类纹样系列／（五）塔形纹，该节第1段", "pages": "P115", "figs": "图2.191 塔形纹", "desc": "塔形纹仅见于楚国的双色锦中，是极富特色的纹样。其单元形由若干个小矩形组织在一个长方形内，顺着织物的经线排列成长条状，上下左右的单元形均作倒置状，形成了丰富的变化。塔形纹中的经线交替起花，经线的组合有三种样式，即朱红和土黄、浅棕色和土黄、深棕和土黄，在有限的条件下获得了多变、华丽的视觉效果。", "supp": "可参考荆州博物馆藏马山1号楚墓织锦，以及《江陵马山一号楚墓》报告。相关研究可参阅《楚人的纺织与服饰》《中国丝绸通史》。", "motion": "repeat"}, {"no": 9, "title": "鳞光织影", "cat": 1, "entryNo": 18, "entry": "鱼纹", "style": "S2", "note": "写实鱼纹的鱼鳞与鳍条变成格点，镜像为团花鱼阵。", "chapter": "第二章／第一节／二、动物类纹样系列／（三）写实动物纹／5、鱼纹，该节第1段", "pages": "P105", "figs": "图2.153 木雕鱼；图2.154 商代铜盘中的鱼纹", "desc": "楚国鱼纹的数量不多，常见两种样式。一种是在靠近郢都的九店东周墓中出现了木质雕刻的立体鱼纹，鱼头、身、尾、鳍等采用写实的方法制作而成。另外一种是作为器物中装饰纹样，以长沙楚墓所出的人物御龙帛画左下角绘制的写实鱼纹为代表。鱼纹在商代的盘、斗等器物中频繁地出现过，但在周代鲜见，这可能与商、周二代的人文精神相关联。", "supp": "可参考湖南省博物馆藏长沙楚墓人物御龙帛画、荆州博物馆藏九店楚墓木雕鱼，以及《江陵九店东周墓》《长沙楚墓》报告。相关研究可参阅《楚艺术史》。", "motion": "repeat"}, {"no": 10, "title": "四叶挑花", "cat": 2, "entryNo": 4, "entry": "叶纹", "style": "S2", "note": "铜镜中心的心形四叶纹转为挑花格点，四向放射。", "chapter": "第二章／第一节／三、植物纹系列／（二）叶纹，该节第1段", "pages": "P111", "figs": "图2.172 椭圆形叶纹、心形叶纹、掌；图2.173 铜镜中心的叶纹；图2.174 重复排列的叶纹", "desc": "楚国所出叶纹大部分出自铜镜中，有的作为主纹，也有的是地纹。叶的造型共有三种样式，分别为椭圆形、心形、掌形，其中的叶脉描绘得较为清晰，具有丰富的层次感。这些叶纹几乎都是成组出现，造型均选用正面、平视的角度，正中心每组少则四片，最多时达到八片，围绕中心凸起的圆形或方形等间距排列成放射状。", "supp": "可参考湖南省博物馆、荆州博物馆藏楚式铜镜，以及《长沙楚墓》《江陵九店东周墓》报告。相关图版可参阅《中国铜镜史》《楚文物图典》。", "motion": "repeat"}, {"no": 11, "title": "蟠螭裂变", "cat": 1, "entryNo": 10, "entry": "蟠绕龙纹（蟠螭纹）", "style": "S3", "note": "蟠绕龙身作为采样源，四叉树按线条疏密递归细分。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／6、蟠绕龙纹，该小节第1段", "pages": "P95", "figs": "图2.118 蟠绕龙纹；图2.119 中妃卫旅 顶面的蟠绕龙纹 簠；图2.120 铜鉴中的蟠绕凤纹；图2.121 漆盒中简化的蟠绕龙纹", "desc": "蟠绕龙纹是指身体相互盘结的龙，包括有角的龙和无角的龙，是楚国器物中出现频率较高的纹样之一，在春秋中、晚期为甚，到战国时期逐渐衰弱。无角且相互蟠绕的龙也被称为蟠螭。田自秉认为：“蟠是缠绕叠压，是有角的小龙，它形成蟠曲纠结，穿插缭绕的纹样。”", "supp": "可参考《浙川下寺春秋楚墓》《浙川和尚岭与徐家岭楚墓》等报告，以及河南省文物考古研究院、湖北省博物馆相关青铜器展品。蟠螭纹在春秋晚期楚式升鼎、铜禁等器物上极为典型。", "motion": "draw"}, {"no": 12, "title": "虺纹分形", "cat": 1, "entryNo": 11, "entry": "虺纹", "style": "S3", "note": "细密蟠虺纹的盘曲单元被分割为大小不一的几何块。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／7、虺纹，该小节第1段", "pages": "P96", "figs": "图2.124 铜 顶面蟠虺纹 簠；图2.125 铜鼎盖上的蟠虺纹；图2.126 铜鼎盖蟠虺纹；图2.127 抽象变形的蟠虺纹", "desc": "虺纹是相互盘曲的小虺，亦被称为“蟠蛇纹”或“蟠虺纹”。由于一些虺纹的单元形非常细密，导致细节无法全部表现出来，有人因而认为虺纹是龙纹的简化形式。朱凤瀚根据《国语·吴语》“为虺弗摧，为蛇将若何”的记载，认为虺乃是一种小蛇，虺纹是蛇纹的一种，但又承认虺纹是由龙纹演化而来。", "supp": "可参考《浙川下寺春秋楚墓》《当阳曹家岗5号楚墓》《天门彭家山楚墓》等报告，以及《中国青铜器全集·东周4》。蟠虺纹是春秋战国楚式青铜器上最常见的细密地纹之一。", "motion": "draw"}, {"no": 13, "title": "垂鳞算像", "cat": 1, "entryNo": 21, "entry": "鳞纹", "style": "S3", "note": "升鼎上的横向鳞纹逐行采样，图元替换为方、圆、十字。", "chapter": "第二章／第一节／二、动物类纹样系列／（四）其它动物纹／2、鳞纹，该节第1段", "pages": "P108", "figs": "图2.163 铜 顶面鳞纹 盉；图2.164 多行的鳞纹；图2.165 铜升鼎中装饰繁缛的鳞纹；图2.166 铜升鼎中的鳞纹", "desc": "鳞纹的骨架由龙、蛇躯干上的鳞片排列而成，被认为是一种简化的龙纹。大多数单元形的大小一致，外形呈铲形，极少数延续了西周时期出现的大小相间的现象。楚国器物中鳞纹的组织形式多变，按照排列的方向，可以分为横向鳞纹和垂鳞纹两种。", "supp": "可参考《浙川下寺春秋楚墓》《天星观二号墓》报告及河南省文物考古研究院、荆州博物馆藏楚式升鼎。垂鳞纹在楚式升鼎腹部极为常见，图版可参阅《中国青铜器全集·东周4》。", "motion": "draw"}, {"no": 14, "title": "勾连递归", "cat": 3, "entryNo": 3, "entry": "勾连云雷纹", "style": "S3", "note": "勾连云雷纹的 T 形骨架按方差阈值分割，放大镜呈现细部。", "chapter": "第二章／第一节／一、天体星像纹样系列／（四）云雷纹，该节第5段", "pages": "P65", "figs": "图2.35 湖北黄州楚墓方豆顶面", "desc": "勾连雷纹由近似“T”形的线段互相勾连组成画面的骨架，在线段的末端卷曲成螺旋形，图与地形成双关的勾状，多为器物中的主纹，其内部或围合的空间内均饰有细密的线状纹样，在青铜器、陶器、漆器、竹器、纺织品中均有出现。", "supp": "可参考《当阳曹家岗5号楚墓》《信阳楚墓》《马山1号楚墓》报告，以及湖北省博物馆、荆州博物馆藏楚式漆器、竹器。相关图版可参阅《楚漆器研究》《楚人的纺织与服饰》。", "motion": "draw"}, {"no": 15, "title": "九宫细分", "cat": 0, "entryNo": 11, "entry": "铜镜天极/九宫格", "style": "S3", "note": "铜镜依九宫格骨架适形构图，四叉树沿四方八位继续细分。", "chapter": "第三章／第三节／一、金属器物中的纹样／（八）其它器物／2、铜镜，该小节第1段", "pages": "P192-193", "figs": "图3.168 各式长沙楚墓铜镜；图3.173 沅水下游的铜镜", "desc": "铜镜是楚国的特色器物，多圆形，少数为方形。铜镜的正面为素面，背面中间铸有圆形或方形的钮，钮上有一至四道弦纹，钮座和镜缘之间的装饰类型较多，既有素面、仅见弦纹的素面镜，又有应用浮雕、透雕、饰等多种手法表现纹样的铜镜，纹样的布局几乎都是依托于铜镜的外形进行适形构图。有的画面中为某一种题材的连续纹样，节奏感极强；有的画面同时拥有主纹和地纹，对比强烈，秩序感鲜明，层次十分丰富。", "supp": "可参考湖南省博物馆、荆州博物馆、安徽省文物考古研究所藏楚式铜镜，以及《长沙楚墓》《六安出土铜镜》图录。相关研究可参阅《中国古代铜镜》《中国铜镜史》。", "motion": "draw"}, {"no": 16, "title": "云气无尽", "cat": 0, "entryNo": 15, "entry": "云气纹", "style": "S4", "note": "卷曲云气外形加厚为米金团块，错位平铺成无限云海。", "chapter": "第五章“楚国纹样的历史地位及启示”／第一节“楚国纹样影响了秦汉纹样的基调”／二、楚国纹样对汉代纹样的影响，该节第2段", "pages": "P287", "figs": "图5.2 秦代瓦当；图5.3 秦代瓦当", "desc": "在纹样题材方面，既延续了龙、凤、北极星的形象，出现了大量的新纹样，如生动多变的仙人、瑞兽、云气纹等，其中的云气纹在漆器中的造型最为丰富，有时甚至与龙纹、凤纹融合在一起，这正是楚国曾经流行的抽象变形的龙凤纹的延续与发展。", "supp": "可参考湖南省博物馆藏马王堆汉墓漆器、湖北省博物馆藏云梦睡虎地秦墓漆器，以及《长沙马王堆一号汉墓》《云梦睡虎地秦墓》报告。相关研究可参阅《楚艺术史》《中国工艺美术史》。", "motion": "cloud-flow"}, {"no": 17, "title": "卷云连绵", "cat": 3, "entryNo": 4, "entry": "O形、C形、S形云纹", "style": "S4", "note": "C 形、S 形云纹的带状单元，奇数列镜像连续。", "chapter": "第二章／第一节／一、天体星像纹样系列／（四）云雷纹，该节第1—4段", "pages": "P65", "figs": "图2.31 铜鼎中的“C”形云纹；图2.32 漆勺中的“S”形云纹", "desc": "“O”形云纹整体向圆圈内卷曲，亦被称为“涡纹”，一些外圈常带有尾巴，大多以彩绘的形式出现在漆器或陶器中。“C”形云纹的两端向同一方向卷曲而呈C形，在器物中既有非常严密的排列方式，又有十分自由的形式，常出现在一些适合纹样中，与抽象凤纹极为相似。“S”形云纹整体为修长的方形或“S”形，由一条线段各向一边卷成“S”形螺旋形，在器物中或呈直立状，或呈水平状。", "supp": "可参考荆州博物馆、湖北省博物馆藏楚式漆器、陶器，以及《江陵雨台山楚墓》《江陵九店东周墓》报告。相关研究可参阅《楚漆器研究》。", "motion": "cloud-flow"}, {"no": 18, "title": "鹿行云泽", "cat": 1, "entryNo": 15, "entry": "鹿纹", "style": "S4", "note": "云梦泽写实鹿纹作单元，半跳接平铺成鹿群。", "chapter": "第二章／第一节／二、动物类纹样系列／（三）写实动物纹／2、鹿纹，该节第1段", "pages": "P102", "figs": "图2.142 各种鹿纹", "desc": "楚国地处云梦泽腹地，此地在当时是鹿的栖息地。因而，楚国器物中存在一些写实的鹿纹，鹿角纤细，与现代的梅花鹿大体相当，没有北方驯鹿所拥有的分枝繁复的大角。楚国鹿纹既有平面描绘的形象，多见于青铜器中，又有大量的立体形象，如漆木座屏中的圆雕鹿和鹿鼓等。《说文》：“鹿，兽也，象头角四足之形。”古代认为鹿是一种神物，是人升仙时的乘骑。", "supp": "可参考荆州博物馆、湖北省博物馆藏楚式漆木鹿、鹿架鼓，以及《江陵雨台山楚墓》《江陵马山一号楚墓》报告。相关研究可参阅《楚艺术史》《楚漆器研究》。", "motion": "repeat"}, {"no": 19, "title": "蝉蜕垂叶", "cat": 1, "entryNo": 17, "entry": "蝉形纹", "style": "S4", "note": "蝉形纹（垂叶纹）的三角骨架上下相间排列。", "chapter": "第二章／第一节／二、动物类纹样系列／（三）写实动物纹／4、蝉形纹，该节第1段", "pages": "P104", "figs": "图2.146 殷墟蝉纹；图2.147 铜壶中的蝉纹；图2.148 较短的蝉纹；图2.149 相互呼应的蝉纹", "desc": "楚国的蝉形纹在青铜器中较为流行，在漆器、陶器中数量较少，常在器物表面呈二方连续状排列，一些考古简报中称其为垂叶纹。楚国蝉形纹的前身应该是由商周时期的蝉纹演变而来，最终保留了蝉纹的外轮廓线为骨架，在其中组织各种题材的纹样，如龙纹、云纹等。", "supp": "可参考《浙川下寺春秋楚墓》《当阳赵家湖楚墓》《天门彭家山楚墓》等报告。蝉形纹在楚式青铜鼎、铜壶、铜缶上均有发现，图版可参阅《中国青铜器全集·东周4》。", "motion": "repeat"}, {"no": 20, "title": "四叶周天", "cat": 2, "entryNo": 6, "entry": "四叶纹", "style": "S4", "note": "“发于一，周于四”的四叶纹，平铺成方位循环的地纹。", "chapter": "第二章／第一节／三、植物纹系列／（二）叶纹，该节第2段", "pages": "P111", "figs": "图2.175 大汶口文化四叶纹", "desc": "其中，四片一组的叶纹数量最多，曾经被人称为四叶纹，其历史也最悠久，在新石器时期大汶口文化中就已经有这种类型的纹样出现。这种四叶纹极有可能与先秦时期的古人表现的天极或天盖，《说苑·辨物》中有：“发于一……周于四”，说明了“四”所蕴含的重要意义。楚国铜镜中所存在的四片以上的叶纹组合正是在此基础上衍生而来的。", "supp": "可参考山东省博物馆、南京博物院藏大汶口文化彩陶，以及湖南省博物馆、荆州博物馆藏楚式铜镜。相关研究可参阅《中国彩陶图谱》《中国铜镜史》。", "motion": "repeat"}, {"no": 21, "title": "蛇龙巫舞", "cat": 1, "entryNo": 7, "entry": "蛇形龙纹", "style": "S5", "note": "蛇形龙的盘曲身体作花瓣，八向旋转成霓虹团花。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／1、龙纹类别／（3）蛇形龙纹，该小节第1段", "pages": "P91", "figs": "图2.101 漆栀中的蛇形龙纹；图2.10 琴瑟中的蛇形龙纹；图2.10 龙凤相蟠纹；图2.104 铜敦顶面蛇形龙纹", "desc": "蛇形龙纹是在写实龙纹的基础上省略了龙足而变成了蛇身，龙头的特征大多仍然被保留，有的龙头未做改变，有的则省略了龙角而导致龙头呈三角形，或保留了一对突出的大圆眼。蛇形龙纹的身体修长，身体上满饰各类细密的纹样，如云雷纹、平行线纹等。", "supp": "可参考《江陵雨台山楚墓》《当阳曹家岗5号楚墓》《江陵九店东周墓》等报告，以及荆州博物馆、湖北省博物馆相关漆器展品。蛇形龙纹在楚漆器、铜器上均有发现，图像可参阅《楚漆器研究》。", "motion": "rotate"}, {"no": 22, "title": "镇墓引魂", "cat": 1, "entryNo": 22, "entry": "镇墓兽", "style": "S5", "note": "圆形龙纹构图旋转复制，霓虹光晕象征引魂升天。", "chapter": "第三章“楚国器物中装饰纹样的表现形式及艺术特征”／第三节“各类楚国器物中纹样的艺术特征”／二、漆器中的纹样／（三）明器／1、漆木镇墓兽，该节第1段", "pages": "P224、P225、P226、P227", "figs": "图3.265 余岗楚墓镇墓兽；图3.266 余岗楚墓镇墓兽；图3.269 长沙楚墓漆镇墓兽；图3.270 黄州镇墓兽", "desc": "“镇墓兽”是楚国特有的陪葬器物，最早由日本学者水野清一在考证后称其为“镇墓兽”，中国学者在以后的研究中都延续使用了这一命名。“镇墓兽”常与青铜礼器或陶制仿铜礼器共出，使用者的身份以士及其以上的阶层为主。“镇墓兽”从春秋中晚期一直延续到战国晚期，并影响了后世的丧葬习俗，直到唐代的墓葬中仍有“镇墓兽”出现。书中认为楚墓中所出的“镇墓兽”即为龙的造型，是引导死者升天的神物。", "supp": "可参考荆州博物馆、湖北省博物馆、湖南省博物馆藏楚式镇墓兽，以及《江陵雨台山楚墓》《江陵天星观1号楚墓》《信阳楚墓》等报告。相关研究可参阅《楚漆器研究》《楚艺术史》。", "motion": "rotate"}, {"no": 23, "title": "镜心天极", "cat": 0, "entryNo": 11, "entry": "铜镜天极/九宫格", "style": "S5", "note": "铜镜放射状光芒纹作中心，外圈旋转镜像。", "chapter": "第三章／第三节／一、金属器物中的纹样／（八）其它器物／2、铜镜，该小节第1段", "pages": "P192-193", "figs": "图3.168 各式长沙楚墓铜镜；图3.173 沅水下游的铜镜", "desc": "铜镜是楚国的特色器物，多圆形，少数为方形。铜镜的正面为素面，背面中间铸有圆形或方形的钮，钮上有一至四道弦纹，钮座和镜缘之间的装饰类型较多，既有素面、仅见弦纹的素面镜，又有应用浮雕、透雕、饰等多种手法表现纹样的铜镜，纹样的布局几乎都是依托于铜镜的外形进行适形构图。有的画面中为某一种题材的连续纹样，节奏感极强；有的画面同时拥有主纹和地纹，对比强烈，秩序感鲜明，层次十分丰富。", "supp": "可参考湖南省博物馆、荆州博物馆、安徽省文物考古研究所藏楚式铜镜，以及《长沙楚墓》《六安出土铜镜》图录。相关研究可参阅《中国古代铜镜》《中国铜镜史》。", "motion": "rotate"}, {"no": 24, "title": "北辰回旋", "cat": 0, "entryNo": 1, "entry": "北极星像纹", "style": "S5", "note": "器物顶面的“北极星像纹”旋涡，八向复制成回旋团花。", "chapter": "第二章／第一节／一、天体星像纹样系列／（一）“北极星像纹”，该节标题下第1段", "pages": "P48", "figs": "图2.2 器壁上的“北极星像纹”：①铜浴缶；②小口鼎；③铜浴缶。", "desc": "今人李学勤、阿城、吴广平等多位学者均认为东皇太一即为楚人心目中的北极星。东皇太一是楚人心目中的最高神灵，屈原在《楚辞·九歌》中开篇就对其进行了描述，足见其身份之显赫，与楚人关系之密切。《楚辞章句》中有：“太一，星名，天之尊神，祠在楚东以配东帝，故云东皇。”楚国器物中存在大量的“北极星像纹”，其中包括象征北极星的太一、北斗或太阳围绕太一运动的轨迹、龙、凤等内容。书中还讨论了其命名依据、类型、溯源及象征意义。", "supp": "可参考湖北省博物馆、荆州博物馆、河南省文物考古研究院藏楚式铜器、漆器，以及《包山楚墓》《天星观二号墓》《浙川下寺春秋楚墓》报告。相关研究可参阅《中国天文考古学》《楚艺术史》。", "motion": "rotate"}, {"no": 25, "title": "茱萸辟邪", "cat": 2, "entryNo": 5, "entry": "茱萸纹", "style": "S5", "note": "铜镜中的叶纹（茱萸说）作瓣，洋红到青的光晕。", "chapter": "第二章／第一节／三、植物纹系列／（二）叶纹，该节第2段", "pages": "P111", "figs": "图2.172 椭圆形叶纹、心形叶纹、掌；图2.173 铜镜中心的叶纹；图2.174 重复排列的叶纹", "desc": "由于先秦时期所出的植物纹样较少，多名学者对这种叶纹的象征意义做出了论断，但众说纷纭。郭廉夫等人认为这是一种茱萸纹，起到逢凶化吉的作用，田自秉则将其看做莲花纹。书中并未把“茱萸纹”列为独立楚纹样，而是在“叶纹”中作为象征意义的一种解释出现。", "supp": "可参考《中国纹样史》《中国丝绸纹样史》相关论述，以及湖南省博物馆藏楚式铜镜、丝织品。茱萸纹在汉代织锦中较为常见，楚地叶纹被视为其早期形态之一。", "motion": "rotate"}, {"no": 26, "title": "剪凤回首", "cat": 1, "entryNo": 1, "entry": "凤鸟纹", "style": "S6", "note": "回首凤鸟剪为玫粉主形，墨绿小凤对角呼应。", "chapter": "第二章“楚国纹样的类别及构成要素”／第一节“楚国纹样的类别及象征意义”／二、动物类纹样系列／（一）凤鸟纹系列，该节标题下第1段", "pages": "P67、P68", "figs": "图2.36 锡器中与太阳共生的凤纹；图2.37 凤鸟践蛇纹绣中的鱼尾凤；图2.39 长鱼尾凤鸟纹；图2.40 短鱼尾凤鸟纹", "desc": "在楚国器物中，凤鸟纹是极具地域特色的纹样，虽然在商、西周时期就已经有了大量的凤鸟纹，但其造型均与楚国凤鸟纹存在差异。楚人一方面继承、发展了商、西周以来的凤鸟纹，另一方面由于祝融亦被楚人认为是其祖先之一，而凤正是祝融的象征，因而楚人在器物中有意的突出了凤纹的地位，其数量远超东周时期中原地区的诸侯国。书中将楚国凤鸟纹分为六种样式：形体完整的凤鸟纹、简化的凤鸟纹、龙形凤纹、三头凤纹、扶桑凤鸟纹、羽人纹。", "supp": "可参考湖北省博物馆“楚文化”专题展、荆州博物馆楚式漆器展及《江陵马山一号楚墓》考古报告。马山一号楚墓出土的凤鸟花卉纹绣、蟠龙飞凤纹绣等，是研究楚国凤鸟纹最权威的实物资料之一；《中国青铜器全集·东周4》《楚美术图集》也收录有大量楚系凤鸟纹线图与图版。", "motion": "bloom"}, {"no": 27, "title": "纸龙游云", "cat": 1, "entryNo": 5, "entry": "龙纹", "style": "S6", "note": "写实龙纹的身躯与斑点刻成镂空沟槽，正负形清晰。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列，该节标题下第1段", "pages": "P87、P88、P89", "figs": "图2.86 金文、甲骨文中的龙纹；图2.87 楚王熊章镈；图2.88 王子午鼎；图2.89 九连墩铜壶耳", "desc": "与凤纹类似，龙纹也是楚国器物中出现频率最高的纹样之一，从春秋时期开始流行于楚国，一直到战国末期。楚国龙纹不仅数量较多，而且造型样式繁多，各类器物中所出现的龙纹鲜有完全一样的造型，体现了楚人不守成规、因势而变的装饰原则。书中将楚国龙纹大致分为九类：写实龙纹、凤形龙纹、蛇形龙纹、两头龙纹、双体龙纹、蟠绕龙纹、虺纹、散鳞纹、变形云龙纹。", "supp": "可参考湖北省博物馆、河南省文物考古研究院、荆州博物馆相关楚墓出土器物，以及《浙川下寺春秋楚墓》《包山楚墓》《曾侯乙墓》等报告。《中国青铜器全集·东周4》收录有大量楚系龙纹青铜器图版。", "motion": "bloom"}, {"no": 28, "title": "於菟伏影", "cat": 1, "entryNo": 16, "entry": "虎纹", "style": "S6", "note": "楚语称虎为“於菟”，昂首前扑的虎形剪成块面。", "chapter": "第二章／第一节／二、动物类纹样系列／（三）写实动物纹／3、虎纹，该节第1段", "pages": "P103", "figs": "图2.143 甲片中的虎纹；图2.144 漆器中的虎纹；图2.145 双虎连体玉璜", "desc": "楚语中称老虎为“於菟”，楚国虎纹既有两足尾卷的平面、侧面形象，又有立体的圆雕造型，整个身体的动态也较为丰富，既有娴静的低首匍匐之状，又有动态十足的昂首前扑状。在青铜器、纺织品、玉器、漆器中均有发现，大多与龙、凤并处，是装饰中的配角，流行时间较长，从春秋一直到战国晚期均有发现。其中，以玉器中虎纹的造型、装饰最为丰富。", "supp": "可参考湖北省博物馆、荆州博物馆、湖南省博物馆藏楚式虎座鸟架鼓、虎座飞鸟及玉虎佩。相关考古报告有《江陵雨台山楚墓》《包山楚墓》《九连墩》等。", "motion": "bloom"}, {"no": 29, "title": "金乌负日", "cat": 0, "entryNo": 7, "entry": "太阳纹", "style": "S6", "note": "与太阳共生的鸟纹剪影，米金云纹托起。", "chapter": "第二章／第一节／一、天体星像纹样系列／（三）太阳纹，该节标题下第1段", "pages": "P63", "figs": "图2.27 包山楚墓凤鸟纹刺绣；图2.28 楚国丝绸中的太阳形象", "desc": "太阳纹是楚国器物中出现频率较高的纹样之一。屈原在《九歌》中所描述的东君正是太阳的形象。其大小不一，有时出现在凤纹的身体中，有时又单独出现，说明楚人对其极为重视，象征楚人的祖先祝融。由于太阳能够带来光明，与农业生产、安全等密切相关，在上古人民的生活中十分重要。楚国的太阳纹以圆形为主，大多与凤纹共生，内部有多个大小不一的小圆圈。", "supp": "可参考《包山楚墓》《马山1号楚墓》报告，以及荆州博物馆、湖北省博物馆藏楚式刺绣、漆器。相关研究可参阅《楚人的纺织与服饰》《楚艺术史》。", "motion": "bloom"}, {"no": 30, "title": "垂柳剪影", "cat": 2, "entryNo": 7, "entry": "树纹", "style": "S6", "note": "漆器中柔美的垂柳树纹剪成双色对树。", "chapter": "第二章／第一节／三、植物纹系列／（三）树纹，该节第1段", "pages": "P112", "figs": "图2.176 漆器中的各式树纹；图2.177 铜 中的树纹", "desc": "楚国的树纹有多种样式，往往是纹样中的配角，为了营造整体的主题氛围而存在。既有写实的造型，类似于垂柳，如包山楚墓、长沙楚墓漆木器中的彩绘树纹，具有一种柔美、飞动的形式美感。又有一些抽象的表现形式，如余岗楚墓铜匜壁上饰有一圈几何化的树纹等。还有一些丝织品中表现了太阳栖息的扶桑树，这类纹样常与凤纹融成一体，多用曲直相结合的线条造型，十分生动，塑造出楚人精神世界中的太阳崇拜体系。", "supp": "可参考《包山楚墓》《长沙楚墓》《余岗楚墓》报告，以及荆州博物馆、湖南省博物馆藏楚式漆器。相关图版可参阅《楚漆器研究》《楚美术图集》。", "motion": "bloom"}, {"no": 31, "title": "双首机龙", "cat": 1, "entryNo": 8, "entry": "两头龙纹", "style": "S7", "note": "两头龙纹拆成折线色块，龙身接入齿轮与连杆。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／1、龙纹类别／（4）两头龙纹，该小节第1段", "pages": "P92", "figs": "图2.105 d”形和“b”形双头龙纹；图2.106 W”形双头龙；图2.107 相互蟠绕的两头龙纹与单头龙纹；图2.108 各式非蟠绕状的两头龙纹", "desc": "两头龙纹是两条龙共用一个身体的纹样类型，在楚国青铜器、玉器中均有出现。两头龙纹中龙头的特征大多较为明确，龙身的造型几无定法，按照龙身的差异可以分为两种类别，即蟠绕状的两头龙纹和非蟠绕状的两头龙纹。", "supp": "可参考《浙川下寺春秋楚墓》《浙川和尚岭与徐家岭楚墓》《包山楚墓》等报告，以及河南省文物考古研究院、湖北省博物馆相关藏品。相关图版可参阅《中国青铜器全集·东周4》。", "motion": "rotate"}, {"no": 32, "title": "兽面齿轮", "cat": 1, "entryNo": 20, "entry": "兽面纹", "style": "S7", "note": "铺首兽面的双目与卷角改为机械构件，画龙点睛。", "chapter": "第二章／第一节／二、动物类纹样系列／（四）其它动物纹／1、兽面纹，该节第1段", "pages": "P106", "figs": "图2.158 银带钩中的写实兽面纹；图2.159 龙纹蟠曲而成的兽面纹；图2.160 铸客大鼎足；图2.161 剑格上的兽面纹", "desc": "兽面纹的历史悠久，最早出现在距今五千年前长江下游地区的良渚文化玉器上，之后成为商代青铜器中的主要装饰纹样。宋代《宣和博古图》曾根据先秦文献中的记载将其命名为“饕餮纹”。楚国器物中，兽面纹常出现在器物足部顶端和提手、器物铺首中，其尺寸大小不一，但是常起到画龙点睛的作用。书中将楚国兽面纹分为写实兽面纹、龙纹蟠曲而成的兽面纹、简化兽面纹三种类型。", "supp": "可参考上海博物馆、湖北省博物馆、河南省文物考古研究院藏楚系青铜器，以及《浙川下寺春秋楚墓》《浙川和尚岭与徐家岭楚墓》报告。兽面纹研究可参阅《商周青铜器幻想动物纹研究》《中国青铜器综论》。", "motion": "rotate"}, {"no": 33, "title": "苍龙引擎", "cat": 0, "entryNo": 9, "entry": "苍龙星宿", "style": "S7", "note": "西水坡蚌塑龙虎（苍龙星宿）重构为荧光机械兽。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／2、楚国龙纹的溯源，该节第2段", "pages": "P99", "figs": "图2.134 濮阳西水坡龙纹；图2.135 苍龙宿和金文、甲骨文", "desc": "河南濮阳西水坡新石器时期遗址45号墓中也出现了龙的形象，被誉为“华夏第一龙”。在墓室中部壮年男性骨架的左右两侧，用蚌壳精心摆塑龙虎图案。蚌壳龙图案摆于人骨架的右侧，头朝北，背朝西，身长1.78米，高0.67米。龙昂首，曲颈，弓身，长尾，前爪扒，后爪蹬，状似腾飞。冯时认为这是上古时期的星图，龙形应为东方苍龙星宿之象。", "supp": "可参考河南省文物考古研究院、濮阳西水坡遗址考古报告，以及《中国天文考古学》。相关研究可参阅《文物》《考古》中关于西水坡45号墓的论文。", "motion": "rotate"}, {"no": 34, "title": "回纹矩阵", "cat": 3, "entryNo": 17, "entry": "人字纹、回字纹、矩形纹、十字纹、山字纹、雷纹", "style": "S7", "note": "竹器编织回纹的方折线变成电路走线与方格点阵。", "chapter": "第三章／第三节／二、漆器中的纹样／（一）生活用器／8、漆制竹器，该节第1段", "pages": "P214", "figs": "图3.241 苗族田园轩陌纹", "desc": "楚国竹器有竹筒、盒、扇等，其中的纹样采用髹饰红、黑二色的竹篾根据不同的编织手法表现而出，纹样均为几何形，如十字形纹、人字形纹、勾连雷纹、矩纹、折线纹、回纹等。", "supp": "可参考荆州博物馆藏马山1号楚墓竹扇、竹筒，以及《江陵马山一号楚墓》报告。相关研究可参阅《楚人的纺织与服饰》《楚漆器研究》。", "motion": "rotate"}, {"no": 35, "title": "六角电路", "cat": 3, "entryNo": 9, "entry": "多角形纹", "style": "S7", "note": "丝织品六边形纹与菱形骨架转为荧光色块。", "chapter": "第二章／第一节／四、几何类纹样系列／（四）多角形纹，该节第1段", "pages": "P114", "figs": "图2.186 陶盘中的太阳状图形；图2.187 陶壶；图2.188 凤鸟凫几何纹；图2.189 六边形纹", "desc": "楚国器物中的多角形有多种样式，常见的有三角形和六角形。三角形纹在丝织品、陶器、漆木器等多种材质中均有发现，以陶器中的形式最为丰富。其中排列的形式均依据一定的组织原则，规律性极强，如鄂城楚墓陶盘顶面以排成环状的三角形表现太阳的光芒，当阳岱家山楚墓所出陶壶表面的三角形依据其中的菱形骨架有规律的穿插组织着，富有强烈的节奏感。", "supp": "可参考《鄂城楚墓》《当阳岱家山楚墓》《江陵马山一号楚墓》报告，以及湖北省博物馆、荆州博物馆藏楚式陶器、丝织品。相关图版可参阅《楚文物图典》。", "motion": "rotate"}, {"no": 36, "title": "三首离朱", "cat": 1, "entryNo": 2, "entry": "三头凤纹", "style": "S8", "note": "三头凤（太阳神鸟离朱）只留外轮廓，一笔线描。", "chapter": "第二章／第一节／二、动物类纹样系列／（一）凤鸟纹系列／1、凤纹的类别／（3）三头凤纹，该小节第1段", "pages": "P72", "figs": "图2.53 三头凤", "desc": "三头凤是楚国刺绣中特有的一幅纹样，常成为学术界研究、争论的焦点。其造型独特，正中间的风头上长有对称的长冠，左右各有三根垂叶，面部似正面的，圆腹、细颈、长腿，双翅向外张开，顶端采用“兼体造型”的方法形成另外二个风头，最终形成三首风。书中认为三头凤正是《山海经》中所记载的太阳神鸟离朱，周围的植物为三珠树，表现了楚人对太阳及祖先的崇拜。", "supp": "可参考荆州博物馆、湖北省博物馆相关展陈，以及《江陵马山一号楚墓》报告中的刺绣线图。三头凤纹常见于马山一号楚墓出土的丝绸刺绣，相关研究可参阅《江汉考古》《文物》等期刊中关于楚绣纹样的专题论文。", "motion": "draw"}, {"no": 37, "title": "一首双身", "cat": 1, "entryNo": 9, "entry": "双体龙纹", "style": "S8", "note": "一头双身的龙纹统一线宽，大面积留白。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／1、龙纹类别／（5）双体龙纹，该小节第1段", "pages": "P94", "figs": "图2.114 琴瑟中的双体龙纹；图2.115 甲片中的双体龙纹；图2.117 商周时期一头双体龙", "desc": "楚国器物中不仅有双头龙纹，而且有一首双身的龙纹，在此将这种一头双身的龙纹称为双体龙纹。双体龙纹的龙头居中，龙角鲜明，大部分仍然保留了龙足，双身或向两侧伸展呈波浪线形，或相互蟠绕呈绳状，龙头的描绘既有正面，又有侧面，在楚国的金属器物、漆器、玉器中均有发现。", "supp": "可参考《当阳曹家岗5号楚墓》《九连墩》等考古报告，以及湖北省博物馆藏九连墩楚墓玉器、青铜器。双体龙纹与商周兽面纹、双龙组合纹有渊源关系，相关研究可参阅《中国青铜器综论》。", "motion": "draw"}, {"no": 38, "title": "十字天极", "cat": 0, "entryNo": 5, "entry": "天极纹", "style": "S8", "note": "陶盘“天极纹”的十字结构配一轮朱砂日。", "chapter": "第二章／第一节／一、天体星像纹样系列／（二）“天极纹”，该节标题下第1段", "pages": "P61", "figs": "图2.20 屈家岭文化、二里头文化、商周时期的“天极纹”；图2.21 楚国“天极纹”；图2.22 楚国苓床中的“天极纹”；图2.23 楚国陶盘中的“天极纹”", "desc": "楚国器物中存在大量表现楚人心目中北极星所在的天极的图像，外形多以“十”字形为基础，周边还有时出现写实或抽象的龙纹或凤纹等，《史记·天官书》：“中宫天极星，其一明者，太一长居也。”这里的“天极纹”正是依据这一记载而命名。与“北极星像纹”相比，“天极纹”中没有表现北斗和太阳围绕其旋转的运动轨迹，因而“天极纹”并没有动态美感。书中将其分为三种样式。", "supp": "可参考《当阳曹家岗5号楚墓》《荆门左冢楚墓》《江陵九店东周墓》报告，以及荆州博物馆、湖北省博物馆藏楚式甲片、苓床、陶器。相关研究可参阅《中国天文考古学》。", "motion": "draw"}, {"no": 39, "title": "莲冠立凤", "cat": 2, "entryNo": 3, "entry": "莲花纹铜方壶", "style": "S8", "note": "九连墩铜方壶莲瓣与凤首的线图，极简留白。", "chapter": "第二章／第一节／三、植物纹系列／（一）莲花纹，该节第2段", "pages": "P110", "figs": "图2.169 方壶；图2.170 九连墩铜方壶壶冠；图2.171 各类漆木莲花豆", "desc": "从时间顺序上看，楚国青铜器中的莲花纹要早于漆器，漆器中的莲花纹是由青铜器中的同类纹样发展而来的，二者的造型不尽相同。青铜壶中的莲瓣数为八，如九连墩1号墓铜方壶顶端的莲花纹。青铜器中的莲瓣明显受到中原地区诸侯国所流行的莲瓣造型的影响，整个造型立于方壶的顶盖上，楚人在其中巧妙的融入了凤纹，四个转角处的莲瓣两端均有一个形象清晰的风头。", "supp": "可参考湖北省博物馆藏九连墩1号墓铜方壶、河南省博物院藏莲鹤方壶，以及《九连墩——长江中游的楚国贵族大墓》图录。相关研究可参阅《先秦时期莲瓣造型流变及其含义》。", "motion": "draw"}, {"no": 40, "title": "绹索缠枝", "cat": 3, "entryNo": 7, "entry": "绸纹（绚纹/绳纹）", "style": "S8", "note": "两股纽结的绹纹带，只用一根墨线表现缠绕。", "chapter": "第二章／第一节／四、几何类纹样系列／（二）绸纹，该节第1段", "pages": "P113", "figs": "图2.183 马络饰纹和车马环上的纹；图2.184 秦安大地湾纹", "desc": "绸纹呈立体的绳状，由两条以上的波纹纹交错纽结而成，有粗细、松紧之别，是楚国器物中常见的纹样之一。绸纹在器物中出现的位置、造型等并不固定，有的围合在器壁四周，似乎要对器物起到加固作用，有的出现在器盖顶面，形成圆形的装饰圈，体现了楚人不受约束，因势而异的装饰原则。", "supp": "可参考《浙川和尚岭与徐家岭楚墓》《湖北麻城市李家湾春秋楚墓》报告，以及河南省文物考古研究院、湖北省文物考古研究院藏楚式青铜器、车马器。相关图版可参阅《中国青铜器全集·东周4》。", "motion": "draw"}, {"no": 41, "title": "龙鳞散聚", "cat": 1, "entryNo": 5, "entry": "龙纹", "style": "S9", "note": "S 形曲龙按线条撒布粒子，龙尾处随风解构。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列，该节标题下第1段", "pages": "P87、P88、P89", "figs": "图2.86 金文、甲骨文中的龙纹；图2.87 楚王熊章镈；图2.88 王子午鼎；图2.89 九连墩铜壶耳", "desc": "与凤纹类似，龙纹也是楚国器物中出现频率最高的纹样之一，从春秋时期开始流行于楚国，一直到战国末期。楚国龙纹不仅数量较多，而且造型样式繁多，各类器物中所出现的龙纹鲜有完全一样的造型，体现了楚人不守成规、因势而变的装饰原则。书中将楚国龙纹大致分为九类：写实龙纹、凤形龙纹、蛇形龙纹、两头龙纹、双体龙纹、蟠绕龙纹、虺纹、散鳞纹、变形云龙纹。", "supp": "可参考湖北省博物馆、河南省文物考古研究院、荆州博物馆相关楚墓出土器物，以及《浙川下寺春秋楚墓》《包山楚墓》《曾侯乙墓》等报告。《中国青铜器全集·东周4》收录有大量楚系龙纹青铜器图版。", "motion": "particle"}, {"no": 42, "title": "伏鹿星斑", "cat": 1, "entryNo": 25, "entry": "木雕鹿", "style": "S9", "note": "木雕鹿身上的斑点纹化作星尘，鹿鼓留在聚合处。", "chapter": "第三章／第三节／二、漆器中的纹样／（三）明器／7、木雕鹿，该节第1段", "pages": "P237", "figs": "图3.305 湖北江陵拍马山楚墓和雨台山楚墓彩绘木鹿", "desc": "楚墓中所出的木雕鹿大多偏重写实，通体饰黑漆，身体作伏卧状，仰首侧视，顶插鹿角，满饰红、黄、金色的斑点纹、三角纹等。一些木雕鹿上采用榫卯结构立有以木雕刻而成的实心黑色鼓，鼓上彩绘变形风纹、“北极星像纹”等。在东周时期，楚国的气候适合鹿的生长，故盛产麋、鹿等，说明鹿在当时楚人的生活是十分常见的动物。", "supp": "可参考荆州博物馆、湖北省博物馆藏楚式木雕鹿、鹿架鼓，以及《江陵拍马山楚墓》《江陵雨台山楚墓》报告。相关图版可参阅《楚美术图集》《楚漆器研究》。", "motion": "particle"}, {"no": 43, "title": "日轮聚散", "cat": 0, "entryNo": 7, "entry": "太阳纹", "style": "S9", "note": "内含小圆圈的太阳纹，由粒子聚合成日轮。", "chapter": "第二章／第一节／一、天体星像纹样系列／（三）太阳纹，该节标题下第1段", "pages": "P63", "figs": "图2.27 包山楚墓凤鸟纹刺绣；图2.28 楚国丝绸中的太阳形象", "desc": "太阳纹是楚国器物中出现频率较高的纹样之一。屈原在《九歌》中所描述的东君正是太阳的形象。其大小不一，有时出现在凤纹的身体中，有时又单独出现，说明楚人对其极为重视，象征楚人的祖先祝融。由于太阳能够带来光明，与农业生产、安全等密切相关，在上古人民的生活中十分重要。楚国的太阳纹以圆形为主，大多与凤纹共生，内部有多个大小不一的小圆圈。", "supp": "可参考《包山楚墓》《马山1号楚墓》报告，以及荆州博物馆、湖北省博物馆藏楚式刺绣、漆器。相关研究可参阅《楚人的纺织与服饰》《楚艺术史》。", "motion": "particle"}, {"no": 44, "title": "四山星尘", "cat": 0, "entryNo": 12, "entry": "山川纹/山字纹", "style": "S9", "note": "山字纹铜镜的四“山”以粒子显形，向外飘散。", "chapter": "第三章／第三节／一、金属器物中的纹样／（八）其它器物／2、铜镜，该小节第3段", "pages": "P196", "figs": "图3.187 各类山字纹铜镜；图3.188 益阳楚墓铜镜；图3.190 铜镜；图3.191 长沙楚墓铜镜", "desc": "第三类是山字纹类铜镜。孔祥星认为，山字纹与商周青铜器上的勾连雷纹有关。按照其中山字的数量，可以分为三山纹、四山纹、五山纹、六山纹，山字的造型亦有差别，有的粗壮，有的细长，还有的山字两端的笔画被拉长，围合出来的图形亦十分丰富，有方形、菱形、五角星形等。书中没有“山川纹”专名，山字纹铜镜为相近内容。", "supp": "可参考湖南省博物馆、荆州博物馆藏楚式山字纹铜镜，以及《长沙楚墓》《益阳楚墓》报告。相关研究可参阅《中国古代铜镜》《中国铜镜史》。", "motion": "particle"}, {"no": 45, "title": "云雷涡旋", "cat": 3, "entryNo": 1, "entry": "云雷纹", "style": "S9", "note": "双圆涡的“O”形云纹，粒子沿螺旋聚散。", "chapter": "第二章／第一节／一、天体星像纹样系列／（四）云雷纹，该节标题下第1段。说明：书中将云雷纹放在天体星像纹系列，但因其为几何连续纹样，也可归入几何装饰纹", "pages": "P64", "figs": "图2.30 陶寺蟠龙和商代蟠龙纹", "desc": "云雷纹是由线条构成的连续状螺旋形，圆形的螺旋形曾被称为“云纹”，方形的螺旋形被称为雷纹，二者之间的差别有时并不是非常明显，故在此以“云雷纹”统一命名。楚国的云雷纹大多都是二方或四方连续纹样，其历史可以追溯到江苏金坛三星村新石器时代遗址M248出土的红衣陶豆中。书中又将其分为“O”形云纹、“C”形云纹、“S”形云纹、三角形云雷纹、勾连云雷纹等类型。", "supp": "可参考南京博物院、上海博物馆藏商周青铜器，以及《商周青铜器纹饰》《中国纹样史》。楚式云雷纹图版可参阅《浙川下寺春秋楚墓》《包山楚墓》。", "motion": "particle"}, {"no": 46, "title": "龙首凤身", "cat": 1, "entryNo": 6, "entry": "凤形龙纹", "style": "S10", "note": "凤形龙纹作单元，八向环形复制、逐圈缩小。", "chapter": "第二章／第一节／二、动物类纹样系列／（二）龙纹系列／1、龙纹类别／（2）凤形龙纹，该小节第1段", "pages": "P90", "figs": "图2.98 凤形龙纹；图2.99 凤形龙纹；图2.100 《山海经》中的龙首鸟身神", "desc": "楚国所出凤形龙纹的数量不多，仅在马山1号墓的对龙对凤纹绣中出现过两种样式，但它们在楚国龙纹中属于特色鲜明的纹样类型，具有龙头、凤身、长足、鸟爪等特征。这两种凤形龙纹的长腿与同一画面中凤纹的腿部造型几乎一样，不同之处在于凤形龙纹的头部变成了龙头的造型。", "supp": "可参考《江陵马山一号楚墓》报告及荆州博物馆藏楚绣实物。相关研究可参阅《楚人的纺织与服饰》以及《江汉考古》中关于楚绣龙凤合体纹样的论文。", "motion": "rotate"}, {"no": 47, "title": "虎座飞凤", "cat": 1, "entryNo": 24, "entry": "虎座立凤", "style": "S10", "note": "虎座立凤的鹿角与凤身作中心，外环生长。", "chapter": "第三章／第三节／二、漆器中的纹样／（三）明器／2、漆木虎座立凤，该节第1段", "pages": "P228、P229", "figs": "图3.279 江陵李家台虎座立凤；图3.281 马王堆一号帛画局部", "desc": "虎座立凤由透雕的虎座、飞凤、鹿角共同构成，一只彩绘的凤立于一虎背之上，凤头上昂，黑底上绘卵点纹，双眼外鼓向前观望，嘴微张似作鸣叫状，双翅展开，凤身、尾、翅上彩绘羽纹，凤背之上插有黑色的鹿角，鹿角顶端用有黄、红二色间隔装饰，部分墓葬出土的鹿角上还有彩绘的蟠虺纹，底部的虎通体黑色，呈俯卧状，头上抬，尾部上翘而四爪向前，欲做跃起之势，虎身上绘有红、黄二色的变形凤鸟纹等。", "supp": "可参考荆州博物馆藏江陵李家台虎座立凤、天星观楚墓虎座飞鸟，以及《江陵李家台楚墓》《江陵天星观1号楚墓》报告。相关研究可参阅《楚漆器研究》。", "motion": "rotate"}, {"no": 48, "title": "灵归北辰", "cat": 0, "entryNo": 14, "entry": "苓床天极", "style": "S10", "note": "苓床几何纹样围绕北极星环形排布，象征引魂升天。", "chapter": "第三章／第三节／二、漆器中的纹样／（三）明器／5、苓床，该节第1段", "pages": "P233-234", "figs": "图3.291 施家地楚墓苓床；图3.293 新石器时期“十”字形；图3.294 金文中的“十”字形；图3.295 苗族服饰中的“十”字纹", "desc": "“苓床”仅见于楚墓，在今江陵、长沙、常德等地出土最多，是一种独具特色的陪葬漆木器，主要作为棺木内尸体下的底板，其外形为长方形，上面采用圆雕、浮雕等工艺雕刻各种几何形、龙纹等。书中认为，楚国“苓床”中形成了以表现北极星为中心的纹样群，其目的正是为了引导墓主的灵魂像龙一样升天，与天极中的北极星一样永存。", "supp": "可参考荆州博物馆、湖南省博物馆藏楚式苓床，以及《江陵马山一号楚墓》《荆门左冢楚墓》《长沙楚墓》报告。相关研究可参阅《楚漆器研究》《楚艺术史》。", "motion": "rotate"}, {"no": 49, "title": "莲豆环生", "cat": 2, "entryNo": 8, "entry": "莲花形豆", "style": "S10", "note": "莲花形豆的莲瓣与龙凤座环形复制成生长纹。", "chapter": "第三章／第三节／二、漆器中的纹样／（一）生活用器／3、漆豆／（3）异形豆，该小节第1段", "pages": "P206", "figs": "图3.217、图3.218，见PDF第37页（第二册）。天星观M2漆豆、九连墩M1-E15漆木龙蛇座豆。", "desc": "莲花形豆是楚国漆豆中的特色造型，截止到目前共发现两种类型，二者的豆盘上都有明显的莲花造型，分别出自天星观2号墓和九连墩1号墓。天星观2号墓莲花豆早于九连墩1号墓，以黑漆为底，用红、黄二色彩绘纹样，莲花依附于豆盘壁四周之外，共14瓣，沿着莲瓣的外形绘有一圈二方连续变形凤鸟纹和卷云纹，豆柄和豆盘则由圆雕的凤鸟和龙构成。", "supp": "可参考荆州博物馆藏天星观2号墓莲花豆、湖北省博物馆藏九连墩1号墓莲花豆，以及《天星观二号墓》《九连墩》报告。相关研究可参阅《楚漆器研究》。", "motion": "rotate"}, {"no": 50, "title": "三角雷环", "cat": 3, "entryNo": 2, "entry": "三角云雷纹", "style": "S10", "note": "三角云雷纹单元沿同心环排列，红黑相间。", "chapter": "第二章／第一节／一、天体星像纹样系列／（四）云雷纹，该节第2段", "pages": "P65", "figs": "图2.33 编钟与铜插销；图2.34 三角云纹马络饰", "desc": "根据纹样单元形的结构，常见的三角形云雷纹有两类样式。第一类是由一条呈45度的线段向上下两端内卷，整体形成一个方形，少数在等腰三角形中内卷。第二类呈二方连续状，以连续的折线形成骨架之后，在每个三角形单元中组织了相同的卷曲状云雷纹。", "supp": "可参考《信阳楚墓》《浙川下寺春秋楚墓》《江陵九店东周墓》报告，以及河南省文物考古研究院、荆州博物馆藏楚式青铜器、漆器。相关图版可参阅《中国青铜器全集·东周4》。", "motion": "rotate"}], "star": {"cores": [
